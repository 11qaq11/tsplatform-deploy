services:
  cloud-server:
    build: .
    container_name: tsplatform-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
      - API_BASE_URL=http://122.51.90.193:3000
      - DB_PATH=/data/tsplatform.db
      - STORAGE_PATH=/data
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
      - ADMIN_FEISHU_OPEN_ID=${ADMIN_FEISHU_OPEN_ID}
      - OWNER_FEISHU_OPEN_ID=${OWNER_FEISHU_OPEN_ID}
      - AI_MODEL_API_KEY=${AI_MODEL_API_KEY}
    volumes:
      - tsplatform_data:/data
    restart: unless-stopped

  admin-nginx:
    image: nginx:alpine
    container_name: tsplatform-admin
    ports:
      - "8080:80"
    volumes:
      - ./admin-dist:/usr/share/nginx/html:ro
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cloud-server
    restart: unless-stopped

volumes:
  tsplatform_data:
